<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>삼남매 포인트 플래너</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<meta name="description" content="지민·지호·지윤 삼남매의 오늘의 계획과 숙제를 체크하고 포인트를 모아 보상과 바꾸는 가족용 플래너">
<!-- iOS 홈 화면에 추가 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="삼남매 플래너">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%9F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --c:#2f6bf0;
    --c2:#7cb0ff;
    --c3:#dce9ff;
    --c4:#bcd7ff;
    --csh:rgba(47,107,240,.26);
    --soft:#e9f1ff;
    --ink:#1f2430;
    --ink-2:#5b6472;
    --ink-3:#98a1ae;
    --line:#eef0f4;
    --card:#ffffff;
    --bg1:#f7fbff;
    --bg2:#eaf2fe;
    --ok:#16a34a;
    --radius:20px;
    --shadow:0 6px 20px rgba(30,41,59,.07);
    --shadow-sm:0 2px 8px rgba(30,41,59,.06);
    --nav-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Noto Sans CJK KR",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.45;
    font-size:16px;
    letter-spacing:-.01em;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
  }
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  h1,h2,h3,p{margin:0}
  [hidden]{display:none !important}

  .app{max-width:520px;margin:0 auto;padding:0 16px}

  /* ── 헤더 ── */
  .topbar{
    position:sticky;top:0;z-index:20;
    padding-top:calc(env(safe-area-inset-top) + 10px);
    margin:0 -16px;padding-left:16px;padding-right:16px;
    background:linear-gradient(180deg,rgba(247,251,255,.99),rgba(247,251,255,.97));
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(238,240,244,.9);
  }
  .brandline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .mark{font-size:24px;line-height:1}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .today{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
  .lock-btn{
    width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);
    display:grid;place-items:center;font-size:18px;flex:none;
  }
  .lock-btn:active{transform:scale(.95)}

  .kidtabs{display:flex;gap:6px;padding:10px 0 10px;overflow-x:auto;scrollbar-width:none}
  .kidtabs::-webkit-scrollbar{display:none}
  .kidtab{
    flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 8px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);
    font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;
    border:1.5px solid transparent;transition:transform .12s ease, color .15s ease;
  }
  .kidtab .kname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kidtab .kemoji{font-size:17px;flex:none}
  .kidtab .kpts{font-size:11px;font-weight:800;color:var(--ink-3);background:#f4f6fa;padding:1px 6px;border-radius:9px;flex:none}
  .kidtab:active{transform:scale(.96)}
  .kidtab.on{color:#fff;background:var(--c);background:linear-gradient(135deg,var(--c),var(--c2));border-color:transparent;box-shadow:0 6px 16px var(--csh)}
  .kidtab.on .kpts{background:rgba(255,255,255,.26);color:#fff}

  /* ── 히어로 카드 ── */
  .hero{
    margin-top:4px;border-radius:24px;padding:18px 18px 16px;
    background:linear-gradient(140deg,var(--soft) 0%,#ffffff 78%);
    box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,var(--c3),transparent 70%);
  }
  .hero-top{display:flex;align-items:center;gap:12px;position:relative}
  .avatar{
    width:52px;height:52px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:27px;
    box-shadow:var(--shadow-sm);flex:none;
  }
  .hero-name{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .hero-name .grade{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-left:4px}
  .hero-sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
  .ringwrap{margin-left:auto;position:relative;width:66px;height:66px;flex:none}
  .ring{width:66px;height:66px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5.5;stroke-linecap:round}
  .ring .bg{stroke:var(--c4);opacity:.85}
  .ring .fg{stroke:var(--c);transition:stroke-dashoffset .5s cubic-bezier(.34,1.4,.64,1)}
  .ringtxt{position:absolute;inset:0;display:grid;place-items:center;font-size:14.5px;font-weight:800;color:var(--c)}
  .pointsbox{
    margin-top:14px;display:flex;align-items:flex-end;gap:6px;position:relative;
    background:rgba(255,255,255,.72);border-radius:16px;padding:10px 14px;
  }
  .pointsbig{font-size:32px;font-weight:900;letter-spacing:-.03em;color:var(--c);line-height:1;transition:transform .18s ease}
  .pointsbig.bump{transform:scale(1.14)}
  .pointscap{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
  .pointsbox .goalhint{margin-left:auto;font-size:11.5px;color:var(--ink-2);font-weight:700;text-align:right;line-height:1.3}

  /* ── 섹션 ── */
  .section{margin-top:18px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;padding:0 4px}
  .sec-title{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
  .sec-note{font-size:12px;color:var(--ink-3);font-weight:700}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;border:1px solid rgba(255,255,255,.8)}

  /* ── 오늘의 계획 ── */
  .tasklist{display:flex;flex-direction:column;gap:9px}
  .task{
    display:flex;align-items:stretch;gap:0;width:100%;text-align:left;overflow:hidden;
    background:#fff;border-radius:18px;padding:0;box-shadow:var(--shadow-sm);
    border:1.5px solid #f4f6fa;transition:transform .12s ease,background .2s ease,border-color .2s ease;
    min-height:64px;
  }
  .task:active{transform:scale(.985)}
  .task .tmainbtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:13px 6px 13px 12px;background:none;min-height:62px}
  .tphotobtn{
    width:58px;flex:none;display:grid;place-items:center;font-size:17px;color:var(--ink-3);
    border-left:1px solid var(--line);background:#fbfcfe;position:relative;padding:0;
  }
  .tphotobtn:active{background:var(--soft)}
  .tphotobtn img{width:42px;height:42px;border-radius:10px;object-fit:cover;display:block;box-shadow:var(--shadow-sm)}
  .task .ttag{display:inline-block;font-size:10px;font-weight:800;color:var(--c);background:var(--soft);border-radius:7px;padding:1px 5px;margin-left:5px;vertical-align:1px;white-space:nowrap}
  .task .ck{
    width:28px;height:28px;border-radius:10px;border:2.5px solid #dde2ea;flex:none;
    display:grid;place-items:center;font-size:15px;color:#fff;background:#fff;transition:all .18s ease;
  }
  .task .tmain{flex:1;min-width:0}
  .task .ttitle{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
  .task .tmeta{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px;word-break:keep-all}
  .task .tpts{
    flex:none;font-size:13px;font-weight:800;color:var(--c);
    background:var(--soft);padding:5px 9px;border-radius:11px;
  }
  .task.done{background:linear-gradient(120deg,var(--soft),#fff 90%);border-color:var(--c3)}
  .task.done .ck{background:var(--c);border-color:var(--c)}
  .task.done .ttitle{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--c2)}
  .task.done .tpts{background:#fff;color:var(--ink-3)}

  .empty{
    text-align:center;padding:26px 16px;color:var(--ink-3);font-size:14px;font-weight:600;
    background:#fff;border-radius:18px;border:1.5px dashed #e6e9f0;
  }
  .alldone{
    margin-top:10px;border-radius:18px;padding:14px;text-align:center;font-weight:800;font-size:14.5px;
    background:linear-gradient(120deg,#dcfce7,#f0fdf4);color:#15803d;border:1px solid #bbf7d0;
  }

  .streakcard{display:flex;gap:10px;margin-top:10px}
  .stat{
    flex:1;background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--shadow-sm);text-align:center;
  }
  .stat b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em}
  .stat span{font-size:11.5px;color:var(--ink-3);font-weight:700}

  /* ── 상점 ── */
  .shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .reward{
    background:#fff;border-radius:20px;padding:14px 12px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
    border:1px solid #f7f8fb;
  }
  .reward .remoji{font-size:30px;line-height:1.1;margin-bottom:2px}
  .reward .rtitle{font-size:14.5px;font-weight:800;letter-spacing:-.02em;word-break:keep-all}
  .reward .rdesc{font-size:11.5px;color:var(--ink-3);font-weight:600;min-height:15px;word-break:keep-all}
  .reward .rcost{font-size:14px;font-weight:900;color:var(--c);margin:5px 0 8px}
  .rbtn{
    width:100%;min-height:42px;border-radius:13px;font-weight:800;font-size:14px;
    background:var(--c);background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;
  }
  .rbtn:active{transform:scale(.97)}
  .rbtn[disabled]{background:#f1f3f7;color:var(--ink-3);cursor:not-allowed}
  .rbtn .short{font-size:11.5px;font-weight:700;display:block;margin-top:-1px}
  .shopnote{margin-top:10px;font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:center;background:#fff;border-radius:14px;padding:10px}
  .reward .rmins{font-size:11px;font-weight:800;color:var(--c);background:var(--soft);border-radius:8px;padding:2px 7px;margin:1px 0 3px;white-space:nowrap}
  .reward .rpend{font-size:10.5px;font-weight:800;color:#92620a;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:2px 6px;margin-top:6px}

  /* ── 핸드폰 시간 신청 내역 ── */
  .reqrow{border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);border:1.5px solid #f4f6fa;padding:11px 12px;margin-bottom:8px}
  .reqrow.pending{border-color:#fde68a;background:linear-gradient(180deg,#fffdf5,#fff 70%)}
  .reqrow:last-child{margin-bottom:0}
  .req-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .req-kid{font-size:13px;font-weight:800;letter-spacing:-.02em}
  .req-state{margin-left:auto;font-size:10.5px;font-weight:800;border-radius:8px;padding:3px 7px;background:#f4f6fa;color:var(--ink-3);white-space:nowrap}
  .req-state.pending{background:#fffbeb;color:#92620a;border:1px solid #fde68a}
  .req-state.done{background:#eefaf3;color:#15803d;border:1px solid #bbf7d0}
  .req-state.canceled{background:#f4f6fa;color:#94a3b8}
  .req-title{font-size:14.5px;font-weight:800;margin-top:6px;letter-spacing:-.02em;word-break:keep-all}
  .req-meta{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
  .req-guide{font-size:11px;font-weight:700;color:var(--ink-2);background:#f6f9fe;border-radius:10px;padding:7px 9px;margin-top:7px;line-height:1.45;word-break:keep-all}
  .req-btns{display:flex;gap:6px;margin-top:8px}
  .req-btns .mini{flex:1;min-height:38px}
  .req-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .req-sum span{font-size:11px;font-weight:800;border-radius:9px;padding:5px 8px;background:#f6f9fe;color:var(--ink-2)}
  .dk-badge{font-size:10px;font-weight:800;color:#92620a;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:1px 5px;margin-left:3px;white-space:nowrap}
  .navbadge{position:absolute;top:5px;left:calc(50% + 9px);min-width:16px;height:16px;border-radius:8px;background:#f59e0b;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px;line-height:1}

  /* ── 기록 ── */
  .chart{display:flex;align-items:flex-end;gap:7px;height:132px;padding:8px 2px 0}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bar{
    width:100%;border-radius:8px 8px 5px 5px;background:var(--c3);min-height:4px;
    position:relative;transition:height .45s cubic-bezier(.34,1.3,.64,1);
  }
  .bar.on{background:var(--c);background:linear-gradient(180deg,var(--c),var(--c2))}
  .bar .bval{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:var(--ink-2)}
  .barlabel{font-size:11px;font-weight:700;color:var(--ink-3)}
  .barlabel.today{color:var(--c)}
  .histrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .histrow:last-child{border-bottom:0}
  .histicon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;background:#f4f6fa;flex:none}
  .histicon.earn{background:#e8f7ee}.histicon.redeem{background:#e9f0ff}.histicon.bonus{background:#eef4ff}.histicon.penalty{background:#fdeeee}
  .histmain{flex:1;min-width:0}
  .histtitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .histmeta{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .histamt{font-size:14px;font-weight:900;flex:none}
  .histamt.plus{color:#16a34a}.histamt.minus{color:#dc2626}

  /* ── 부모 모드 ── */
  .gate{text-align:center;padding:26px 18px 22px}
  .gate .gemoji{font-size:38px}
  .gate h2{font-size:17px;font-weight:800;margin-top:6px}
  .gate p{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:5px}
  .dots{display:flex;gap:12px;justify-content:center;margin:18px 0 16px}
  .dot{width:14px;height:14px;border-radius:50%;background:#e8ebf1;transition:all .15s ease}
  .dot.on{background:var(--c);transform:scale(1.12)}
  .dots.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:270px;margin:0 auto}
  .key{height:56px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);font-size:22px;font-weight:700}
  .key:active{transform:scale(.95);background:#f7f8fb}
  .key.del{font-size:17px;color:var(--ink-2)}
  .errmsg{color:#dc2626;font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}

  .pcard{margin-bottom:12px}
  .pcard h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .chipline{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
  .chip{padding:7px 12px;border-radius:11px;background:#f4f6fa;font-size:13px;font-weight:700;color:var(--ink-2)}
  .chip.on{background:var(--c);color:#fff}
  .prow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .pin-name{flex:1;min-width:0;font-size:14px;font-weight:700}
  .prow .pin-meta{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .mini{font-size:12px;font-weight:800;padding:7px 10px;border-radius:10px;background:#f4f6fa;color:var(--ink-2);flex:none;min-height:34px}
  .mini.warn{background:#fee2e2;color:#dc2626}
  .btn-primary{
    width:100%;min-height:48px;border-radius:15px;font-weight:800;font-size:15px;color:#fff;
    background:var(--c);background:linear-gradient(135deg,var(--c),var(--c2));
  }
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{width:100%;min-height:46px;border-radius:14px;font-weight:800;font-size:14.5px;background:#f4f6fa;color:var(--ink-2)}
  .field{display:block;margin-bottom:10px}
  .field>span{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;min-height:46px;border-radius:13px;border:1.5px solid #e6e9f0;background:#fbfcfe;
    padding:0 12px;font-weight:600;outline:none;
  }
  .field textarea{min-height:60px;padding:10px 12px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--c);background:#fff}
  .fieldrow{display:flex;gap:8px}
  .fieldrow .field{flex:1}
  .hint{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.5}
  .divider{height:1px;background:var(--line);margin:12px 0}

  /* ── 기록 · 진행도(일별·주간·월간) ── */
  .segbar{display:flex;gap:6px;background:#fff;border-radius:16px;padding:5px;box-shadow:var(--shadow-sm);margin-bottom:10px}
  .seg{flex:1;min-height:44px;border-radius:12px;font-size:13.5px;font-weight:800;color:var(--ink-2);transition:color .15s ease,background .2s ease;line-height:1.2}
  .seg.on{background:var(--c);background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 4px 12px var(--csh)}
  .seg span{display:block;font-size:10px;font-weight:700;opacity:.82;margin-top:1px}
  .provexport{display:flex;gap:8px;margin-bottom:14px}
  .provexport .btn-ghost{min-height:42px;font-size:13px}
  .prog-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pnav{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);font-size:22px;font-weight:800;line-height:1;color:var(--ink-2);display:grid;place-items:center;flex:none}
  .pnav:active{transform:scale(.94)}
  .pnav[disabled]{opacity:.32}
  .pnavlabel{flex:1;text-align:center;min-width:0}
  .pnavlabel b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
  .pnavlabel span{font-size:11.5px;color:var(--ink-3);font-weight:700}
  .weekbars{display:flex;gap:6px;align-items:flex-end}
  .wcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
  .wcol:active{transform:scale(.97)}
  .wtrack{display:flex;align-items:flex-end;width:100%;height:96px;border-radius:10px;background:#f2f6fd;overflow:hidden}
  .wbar{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--c);background:linear-gradient(180deg,var(--c),var(--c2));min-height:4px;transition:height .45s cubic-bezier(.34,1.3,.64,1)}

    var p = String(k||'').split('-');

  function hex2(n){ var s = n.toString(16); return s.length<2 ? '0'+s : s; }
  function tint(hex, f){
    var h = String(hex||'#2f6bf0').replace('#','');
    if(h.length===3) h = h.split('').map(function(x){ return x+x; }).join('');

  /* ═══════════ 저장 · 불러오기 ═══════════ */
  var storageOK = true;
  var paletteUpgraded = false;
  function load(){
    var raw = null;
    try{ raw = window.localStorage.getItem(STORAGE_KEY); }
    catch(e){ storageOK = false; }
    if(!raw) return defaultState();
    try{
      var s = JSON.parse(raw);
      return normalize(s);
    }catch(e){ return defaultState(); }
  }
  function normalize(s){
    var d = defaultState();
    if(!s || typeof s !== 'object') return d;
    if(!Array.isArray(s.children) || !s.children.length) s.children = d.children;
    if(!Array.isArray(s.tasks)) s.tasks = [];
    if(!Array.isArray(s.rewards)) s.rewards = d.rewards;
    if(!Array.isArray(s.requests)) s.requests = [];
    if(!Array.isArray(s.ledger)) s.ledger = [];
    if(!s.checks || typeof s.checks !== 'object') s.checks = {};
    if(!s.snapshots || typeof s.snapshots !== 'object') s.snapshots = {};
    if(!s.settings || typeof s.settings !== 'object') s.settings = {pin:'0000', sound:true};
    if(typeof s.settings.pin !== 'string' || !/^\d{4}$/.test(s.settings.pin)) s.settings.pin = '0000';
    if(typeof s.settings.sound !== 'boolean') s.settings.sound = true;
    if(typeof s.settings.phoneSeeded !== 'boolean') s.settings.phoneSeeded = false;
    /* v4: 아이별 비밀번호 · 클라우드 설정 */
    if(!s.settings.cloud || typeof s.settings.cloud !== 'object') s.settings.cloud = {};
    var cl = s.settings.cloud;
    if(typeof cl.url !== 'string') cl.url = '';
    if(typeof cl.key !== 'string') cl.key = '';
    if(typeof cl.table !== 'string' || !cl.table) cl.table = 'family_state';
    if(typeof cl.bucket !== 'string' || !cl.bucket) cl.bucket = 'proof-photos';
    if(typeof cl.row !== 'string' || !cl.row) cl.row = 'family';
    if(typeof cl.lastSync !== 'number') cl.lastSync = 0;
    if(typeof cl.lastError !== 'string') cl.lastError = '';
    if(typeof cl.enabled !== 'boolean') cl.enabled = !!(cl.key || '').trim() || !cl.url;
    if(typeof s.updatedAt !== 'number') s.updatedAt = 0;
    /* v1(핑크 계열) → v2(블루 계열) 팔레트 이전: 예전 기본색이 그대로 남아 있으면 새 색으로 바꿈다 */
    var upgrading = !s.version || s.version < 2;
    var PALETTE = {
      '#ec4899':'#2f6bf0', '#fce7f3':'#dceaff',   /* 지민: 핑크 → 블루 */
      '#3b82f6':'#6366f1', '#dbeafe':'#e8e8ff',   /* 지호: 블루 → 인디고 */
      '#10b981':'#0d9488', '#d1fae5':'#ccfbf1'    /* 지윤: 그린 → 청록 */
    };
    s.children.forEach(function(c,i){
      c.id = c.id || ('kid'+i);
      c.name = c.name || ('아이'+(i+1));
      c.grade = c.grade || '';
      c.emoji = c.emoji || '🙂';
      c.color = c.color || '#2f6bf0';
      c.soft = c.soft || '#dceaff';
      /* v5: 기기 구분 — 처음 보는 저장 데이터는 알려진 세 남매로 기본값을 잡아 둔다 */
      if(c.device !== 'ios' && c.device !== 'android'){
        c.device = ({jimin:'ios', jiho:'android', jiyoon:'android'})[c.id] || 'android';
      }
      if(upgrading){
        paletteUpgraded = true;
        var lc = String(c.color).toLowerCase(), ls = String(c.soft).toLowerCase();
        if(PALETTE[lc]) c.color = PALETTE[lc];
        if(PALETTE[ls]) c.soft = PALETTE[ls];
        if(c.emoji === '🌸') c.emoji = '💙';
      }
    });
    /* v4: 아이별 4자리 비밀번호 (기본 지민 1111 · 지호 2222 · 지윤 3333, 잠금 켜짐) */
    var DEF_KID_PINS = ['1111','2222','3333'];
    if(!s.settings.kidPins || typeof s.settings.kidPins !== 'object') s.settings.kidPins = {};
    s.children.forEach(function(c,i){
      var kp = s.settings.kidPins[c.id];
      if(!kp || typeof kp !== 'object') kp = {};
      if(typeof kp.pin !== 'string' || !/^\d{4}$/.test(kp.pin)) kp.pin = DEF_KID_PINS[i] || '1234';
      if(typeof kp.lock !== 'boolean') kp.lock = true;
      s.settings.kidPins[c.id] = kp;
    });
    Object.keys(s.settings.kidPins).forEach(function(id){
      if(!s.children.some(function(c){ return c.id === id; })) delete s.settings.kidPins[id];
    });
    s.tasks = s.tasks.filter(function(t){ return t && t.title; }).map(function(t,i){
      t.id = t.id || uid();
      t.points = Math.max(0, parseInt(t.points,10) || 0);
      t.order = (typeof t.order === 'number') ? t.order : i;
      t.time = t.time || '';
      t.note = t.note || '';
      t.needPhoto = !!t.needPhoto;
      if(!s.children.some(function(c){ return c.id === t.childId; })) t.childId = s.children[0].id;
      return t;
    });
    s.rewards = s.rewards.filter(function(r){ return r && r.title; }).map(function(r){
      r.id = r.id || uid();
      r.cost = Math.max(1, parseInt(r.cost,10) || 1);
      r.emoji = r.emoji || '🎁';
      r.desc = r.desc || '';
      /* v5: 핸드폰 사용시간 보상이면 분(1~600)을 함께 저장한다. 0이면 일반 보상(바로 교환) */
      r.minutes = clamp(parseInt(r.minutes,10) || 0, 0, 600);
      return r;
    });
    /* v5: 예전 저장 데이터에는 시간 보상이 없다 → 기본 예시를 한 번만 넣고, 지우면 다시 생기지 않는다 */
    if(!s.settings.phoneSeeded){
      if(!s.rewards.some(function(r){ return r.minutes > 0; })){
        var seed = d.rewards.filter(function(r){ return r.minutes > 0; })[0];
        if(seed) s.rewards.push({id:uid(), title:seed.title, minutes:seed.minutes, cost:seed.cost, emoji:seed.emoji, desc:seed.desc});
      }
      s.settings.phoneSeeded = true;
    }
    /* v5: 핸드폰 시간 신청 내역 정리 (없는 아이의 신청은 버린다) */
    s.requests = s.requests.filter(function(q){
      if(!q || typeof q !== 'object' || !q.childId) return false;
      return s.children.some(function(c){ return c.id === q.childId; });
    }).map(function(q){
      q.id = q.id || uid();
      q.rewardId = q.rewardId || '';
      q.title = q.title || '핸드폰 사용시간';
      q.emoji = q.emoji || '📱';
      q.minutes = clamp(parseInt(q.minutes,10) || 1, 1, 600);
      q.cost = Math.max(0, parseInt(q.cost,10) || 0);
      q.ts = typeof q.ts === 'number' ? q.ts : Date.now();
      q.date = q.date || dateKey(new Date(q.ts));
      q.status = (q.status === 'done' || q.status === 'canceled') ? q.status : 'pending';
      q.doneTs = typeof q.doneTs === 'number' ? q.doneTs : 0;
      q.ledgerId = q.ledgerId || '';
      return q;
    });
    s.ledger = s.ledger.filter(function(e){ return e && typeof e.amount === 'number' && e.childId; }).map(function(e){
      e.id = e.id || uid();
      e.date = e.date || dateKey(new Date(e.ts || Date.now()));
      e.ts = e.ts || Date.now();
      e.type = e.type || (e.amount >= 0 ? 'earn' : 'penalty');
      e.memo = e.memo || '';
      return e;
    });
    normalizeSnapshots(s);     /* v3: 진행도 스냅샷 정리 · 없는 지난 날은 기록에서 되살린다 */
    normalizeChecks(s);        /* v4: 체크 기록 · 인증 사진 구조 정리 */
    s.version = 5;
    return s;
  }

  /* v3까지의 체크 기록은 {ts, ledgerId} 였고, v4부터 사진이 붙는다: {ts, ledgerId, photo:{src,ts,w,h,mode,path}} */
  function normalizeChecks(s){
    if(!s.checks || typeof s.checks !== 'object') s.checks = {};
    Object.keys(s.checks).forEach(function(dayK){
      var day = s.checks[dayK];
      if(!day || typeof day !== 'object'){ delete s.checks[dayK]; return; }
      Object.keys(day).forEach(function(cid){
        var b = day[cid];
        if(!b || typeof b !== 'object'){ delete day[cid]; return; }
        Object.keys(b).forEach(function(tid){
          var e = b[tid];
          if(!e){ delete b[tid]; return; }
          if(typeof e === 'number' || typeof e === 'string'){ b[tid] = {ts: Date.now()}; e = b[tid]; }
          if(typeof e.photo === 'string') e.photo = {src: e.photo, ts: e.ts || Date.now(), mode: 'local'};
          if(e.photo && (typeof e.photo.src !== 'string' || !e.photo.src)) delete e.photo;
          if(e.photo && typeof e.photo.ts !== 'number') e.photo.ts = e.ts || Date.now();
        });
      });
    });
  }

  /* ── 진행도 스냅샷 저장 구조 (v3) ──
     스냅샷은 “그날 마감한 기록”이다. 지난 날짜의 것은 한 번 만들면 다시 계산하지 않는다.
     아직 없는 지난 날짜는 남아 있는 체크·포인트 기록에서 한 번만 만들어 두는다(예전 v1/v2 데이터). */
  var SNAP_KEEP_DAYS = 400;
  function normalizeSnapshots(s){
    var out = {};
    var todayK = dateKey();
    var cutoff = dateKey(addDays(new Date(), -SNAP_KEEP_DAYS));
    var raw = (s.snapshots && typeof s.snapshots === 'object') ? s.snapshots : {};
    var kidIds = (s.children || []).map(function(c){ return c.id; });
    Object.keys(raw).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || k < cutoff || k > todayK) return;
      var day = raw[k];
      if(!day || typeof day !== 'object') return;
      Object.keys(day).forEach(function(cid){
        if(kidIds.indexOf(cid) < 0) return;
        var r = day[cid];
        if(!r || typeof r !== 'object') return;
        var done = Math.max(0, parseInt(r.done,10) || 0);
        var total = Math.max(0, parseInt(r.total,10) || 0);
        var pct = (typeof r.pct === 'number' && isFinite(r.pct)) ? clamp(Math.round(r.pct),0,100) : (total ? Math.round(done/total*100) : 0);
        var items = Array.isArray(r.items) ? r.items.filter(function(x){ return typeof x === 'string'; }).slice(0,60) : [];
        var points = Math.max(0, parseInt(r.points,10) || 0);
        if(!done && !points && !items.length) return;
        out[k] = out[k] || {};
        out[k][cid] = {done:done, total:total, pct:pct, points:points, items:items, updatedAt: r.updatedAt || Date.now()};
      });
    });
    s.snapshots = out;

    /* 오늘 이전 날짜 중 스냅샷이 비어 있는 날을 예전 기록에서 되살림 */
    var dateKeys = {};
    Object.keys(s.checks || {}).forEach(function(k){ dateKeys[k] = 1; });
    (s.ledger || []).forEach(function(e){ if(e && e.date) dateKeys[e.date] = 1; });
    Object.keys(dateKeys).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || k < cutoff || k >= todayK) return;
      (s.children || []).forEach(function(c){
        if(out[k] && out[k][c.id]) return;   /* 이미 있는 스냅샷은 그대로 둔다 */
        var ck = (s.checks[k] && s.checks[k][c.id]) || {};
        var total = 0, done = 0, items = [];
        (s.tasks || []).forEach(function(t){
          if(t.childId !== c.id) return;
          total++;
          if(ck[t.id]){ done++; items.push(t.title); }
        });
        var pts = (s.ledger || []).reduce(function(sum,e){
          return (e.childId===c.id && e.date===k && e.amount>0) ? sum + e.amount : sum; }, 0);
        if(!done && !pts) return;
        out[k] = out[k] || {};
        out[k][c.id] = {done:done, total:total, pct: total ? Math.round(done/total*100) : 0,
                        points:pts, items:items, updatedAt: Date.now()};
      });
    });
  }
  function save(skipCloud){
    if(storageOK){
      try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch(e){
        var freed = false;
        for(var i=0;i<3 && !freed;i++) freed = dropOldestPhoto();
        if(freed){
          toast('저장 공간이 부족해 오래된 인증 사진을 정리하고 다시 저장했어요');
          try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
          catch(e2){ storageOK = false; showStorageWarning(); }
        } else { storageOK = false; showStorageWarning(); }
      }
    }

    var ts = tasksFor(childId);

  function recordOf(dayKey, childId){

      if(lr.done || lr.points) return lr;

      return (tday && tday[childId]) || null;

    var ck = checksOf(dayKey, childId);

  var audioCtx = null;

  function doRedeem(rewardId){

      var e = addEntry(cid, -r.cost, 'redeem', r.emoji + ' ' + r.title + ' ' + r.minutes + '분 신청', {rewardId: r.id, requestId: q.id});

      return;
    }
    addEntry(cid, -r.cost, 'redeem', r.emoji + ' ' + r.title, {rewardId: r.id});
    save(); closeModal(); render();
    chime(true); confetti(26); vibrate([12,40,12]);

  /* ═══════════ 진행도 (일별 · 주간 · 월간) ═══════════ */
  function setText(id, v){ var el = document.getElementById(id); if(el) el.textContent = v; }

  function weekRecords(childId, offset){
    var ws = weekStartOf(addDays(new Date(), (offset||0)*7));
    var days = [], done = 0, pts = 0, pctSum = 0, pctN = 0, perfect = 0;
    var todayK = dateKey();
    for(var i=0;i<7;i++){
      var d = addDays(ws, i), k = dateKey(d);
      var r = recordOf(k, childId);
      days.push({key:k, date:d, label:WD[d.getDay()], rec:r, future:k > todayK});
      if(r){ done += r.done; pts += r.points; pctSum += r.pct; pctN++; if(r.pct >= 100) perfect++; }
    }
    return {start:ws, end:addDays(ws,6), days:days, done:done, points:pts,
            avg: pctN ? Math.round(pctSum/pctN) : 0, pctN:pctN, perfect:perfect};
  }

  function monthRecords(childId, y, m){
    var n = daysInMonth(y,m);
    var lead = new Date(y,m,1).getDay();
    var cells = [], done = 0, pts = 0, pctSum = 0, pctN = 0, perfect = 0;
    var todayK = dateKey();
    for(var i=1;i<=n;i++){
      var d = new Date(y,m,i), k = dateKey(d);
      var r = recordOf(k, childId);
      cells.push({key:k, date:d, rec:r, future:k > todayK});
      if(r){ done += r.done; pts += r.points; pctSum += r.pct; pctN++; if(r.pct >= 100) perfect++; }
    }
    return {lead:lead, cells:cells, done:done, points:pts,
            avg: pctN ? Math.round(pctSum/pctN) : 0, pctN:pctN, perfect:perfect};
  }

  function defaultSelDay(childId, y, m){
    var now = new Date();
    if(sameMonth(now, new Date(y,m,1))) return dateKey(now);
    var mr = monthRecords(childId, y, m);
    var last = null;
    mr.cells.forEach(function(c){ if(c.rec) last = c.key; });
    return last || dateKey(new Date(y,m,1));
  }

  function renderProgress(c){
    c = c || kid(ui.kidId);
    var segs = document.querySelectorAll('#histSeg .seg');
    for(var i=0;i<segs.length;i++){
      var on = segs[i].getAttribute('data-seg') === ui.histSeg;
      segs[i].classList.toggle('on', on);
      segs[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
    var pd = document.getElementById('paneDay'),
        pw = document.getElementById('paneWeek'),
        pm = document.getElementById('paneMonth');

  /* ═══════════ 진행도 저장 (CSV · 텍스트 리포트) ═══════════ */
  function downloadFile(name, text, mime){
    var blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
  }
  function stampName(){
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
  }
  function rowsForExport(childId, sinceKey){
    var rows = [];
    Object.keys(state.snapshots || {}).sort().forEach(function(k){
      if(sinceKey && k < sinceKey) return;
      var s = state.snapshots[k] && state.snapshots[k][childId];
      if(s) rows.push({date:k, done:s.done, total:s.total, pct:s.pct, points:s.points, items:(s.items || []).slice()});
    });
    var tk = dateKey();
    var live = liveRecord(tk, childId);
    if(live.done || live.points){
      var idx = -1;
      for(var i=0;i<rows.length;i++){ if(rows[i].date === tk){ idx = i; break; } }
      var row = {date:tk, done:live.done, total:live.total, pct:live.pct, points:live.points, items:live.items};
      if(idx >= 0) rows[idx] = row; else rows.push(row);
    }
    return rows.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  }
  function csvCell(v){
    var s = String(v==null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  function exportProgressCsv(){
    var c = kid(ui.kidId);
    var since = dateKey(addDays(new Date(), -SNAP_KEEP_DAYS));
    var rows = rowsForExport(c.id, since);
    if(!rows.length){ toast('아직 저장할 진행도 기록이 없어요'); return; }
    var lines = ['날짜,아이,요일,완료 항목 수,전체 항목 수,달성률(%),획득 포인트,완료한 항목'];
    rows.forEach(function(r){
      var d = parseDayKey(r.date);
      lines.push([r.date, c.name, d ? WD[d.getDay()] : '', r.done, r.total, r.pct, r.points,
                  (r.items || []).join(' | ')].map(csvCell).join(','));
    });
    downloadFile('삼남매_진행도_' + c.name + '_' + stampName() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('진행도 CSV를 내려받았어요 · ' + rows.length + '일');
  }
  function exportProgressReport(){

    L.push('');

      L.push('[' + (off === 0 ? '이번 주' : '지난 주') + '] ' + fmtMonthDay(w.start) + ' ~ ' + fmtMonthDay(w.end));
      L.push('  주간 총 완료 ' + w.done + '개 · 평균 달성률 ' + w.avg + '% (기록 ' + w.pctN + '일) · 주간 획득 ' + w.points + 'P · 100% 완주 ' + w.perfect + '일');
      w.days.forEach(function(d){

          (r ? (r.done + '/' + r.total + ' ' + r.pct + '% · ' + r.points + 'P' + ((r.items && r.items.length) ? ' · ' + r.items.join(', ') : '')) : '기록 없음'));
      });

    });
    for(var i=0;i<2;i++){
      var md = new Date(now.getFullYear(), now.getMonth()-i, 1);

      var recs = mr.cells.filter(function(x){ return x.rec; });
      if(recs.length){
        recs.forEach(function(x){
          L.push('  - ' + x.date.getDate() + '일 ' + x.rec.done + '/' + x.rec.total + ' ' + x.rec.pct + '% · ' + x.rec.points + 'P' +
                 ((x.rec.items && x.rec.items.length) ? ' · ' + x.rec.items.join(', ') : ''));
        });
      } else {
        L.push('  - 기록한 날이 없어요.');
      }
      L.push('');
    }
    L.push('※ 진행도는 그날 체크한 상태를 저장해 둔 기록이라, 나중에 계획 항목을 고쳐도 지난 기록은 바뀌지 않아요.');
    downloadFile('삼남매_진행도리포트_' + c.name + '_' + stampName() + '.txt', L.join('\r\n'), 'text/plain;charset=utf-8');
    toast('진행도 요약 리포트를 내려받았어요');
  }

  function compressImage(file, cb){
    if(!file){ cb(null); return; }
    if(!/^image\//.test(file.type || '')){ toast('이미지 파일만 올릴 수 있어요'); cb(null); return; }
    var objUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h) throw new Error('empty image');
        var scale = Math.min(1, PHOTO_MAX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var data = cv.toDataURL('image/jpeg', PHOTO_Q);
        URL.revokeObjectURL(objUrl);
        cb(data, {w: cw, h: ch});
      }catch(e){
        URL.revokeObjectURL(objUrl);
        cb(null);
      }
    };
    img.onerror = function(){ URL.revokeObjectURL(objUrl); cb(null); };
    img.src = objUrl;
  }

  function handlePhotoFile(file){
    var pend = ui.pendingPhoto;
    if(!pend){ toast('먼저 항목의 📷 버튼을 눌러 주세요'); return; }
    toast('사진을 준비하고 있어요…');
    compressImage(file, function(data, dim){
      if(!data){ toast('사진을 읽지 못했어요 · 다른 사진으로 해 보세요'); return; }
      attachPhoto(pend.taskId, pend.dayKey, data, dim);
    });
  }

  function attachPhoto(taskId, dayKey, dataUrl, dim){
    var t = findTask(taskId);
    if(!t) return;
    var cid = t.childId;
    if(kidLocked(cid)){ closeModal(); toast('먼저 비밀번호를 넣어 주세요'); return; }
    var day = dayKey || selKey();
    var bucket = ensureBucket(day, cid);
    var entry = bucket[taskId];
    var earned = false;
    if(!entry){
      var e = addEntry(cid, t.points, 'earn', t.title, {taskId: t.id}, day);   /* 중복 적립 없이 한 번만 */
      entry = {ts: Date.now(), ledgerId: e.id};
      bucket[taskId] = entry;
      earned = true;
    }
    entry.photo = {src: dataUrl, ts: Date.now(), w: (dim && dim.w) || 0, h: (dim && dim.h) || 0, mode: 'local'};
    refreshSnapshot(day, cid);
    state.updatedAt = Date.now();
    save(); closeModal(); render();
    chime(true); vibrate(18); confetti(earned ? 16 : 8);
    toast(earned ? '📷 사진 인증 완료! +' + t.points + 'P' : '📷 사진을 첨부했어요');
    if(cloudReady() && cloudCfg().verified && !cloudCfg().needsSetup){
      var path = cid + '/' + day + '/' + taskId + '-' + Date.now() + '.jpg';
      cloudUploadPhoto(dataUrl, path).then(function(url){
        if(!url) return;
        var b2 = (state.checks[day] && state.checks[day][cid]) || {};
        var en = b2[taskId];
        if(en && en.photo && en.photo.src === dataUrl){
          en.photo.src = url;
          en.photo.mode = 'cloud';
          en.photo.path = path;
          save();
          if(ui.view === 'today' || ui.view === 'parent') render();
        }
      });
    }
  }

  function dataUrlToBlob(dataUrl){
    try{
      var parts = String(dataUrl).split(',');
      var mime = (/data:([^;]+);/.exec(parts[0]) || [])[1] || 'image/jpeg';
      var bin = atob(parts[1] || '');
      var arr = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], {type: mime});
    }catch(e){ return null; }
  }

  /* ═══════════ ☁️ 클라우드 동기화 (Supabase REST · Storage) ═══════════ */
  function cloudCfg(){
    if(!state.settings) state.settings = {};
    if(!state.settings.cloud || typeof state.settings.cloud !== 'object') state.settings.cloud = {};
    var c = state.settings.cloud;
    if(typeof c.url !== 'string') c.url = '';
    if(typeof c.key !== 'string') c.key = '';
    if(typeof c.lastSync !== 'number') c.lastSync = 0;
    if(typeof c.lastPulledAt !== 'number') c.lastPulledAt = 0;
    if(typeof c.lastError !== 'string') c.lastError = '';
    if(typeof c.enabled !== 'boolean') c.enabled = true;
    return c;
  }
  function cloudKey(){ return String(cloudCfg().key || DEFAULT_CLOUD_KEY || '').trim(); }
  function cloudBase(){ return String(cloudCfg().url || DEFAULT_CLOUD_URL || '').trim().replace(/\/+$/, ''); }
  function cloudReady(){
    return !!(cloudCfg().enabled !== false && cloudKey() && /^https?:\/\//.test(cloudBase()));
  }
  function cloudHdrs(extra){
    var key = cloudKey();
    /* publishable/anon 키는 apikey 와 Authorization 둘 다에 넣으면 REST·Storage 모두 통한다 */
    var h = { apikey: key, Authorization: 'Bearer ' + key };
    if(extra) for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra,k)) h[k] = extra[k]; }
    return h;
  }
  function cloudTable(){ return cloudCfg().table || 'family_state'; }
  function cloudRow(){ return cloudCfg().row || 'family'; }
  function cloudBucket(){ return cloudCfg().bucket || 'proof-photos'; }
  function cloudStatusText(){
    var c = cloudCfg();
    if(!cloudReady()) return '이 기기 저장(로컬) 모드 · 클라우드 연결이 꺼져 있어요';
    if(ui.cloudBusy) return '동기화하는 중…';
    if(c.needsSetup) return '☁️ 주소·키 연결됨 · 준비가 하나 남았어요 — 아래 SQL을 한 번 실행한 뒤 ‘지금 동기화’를 눌러 주세요';
    if(c.lastError) return '연결을 확인해 주세요 · ' + c.lastError;
    if(!c.verified) return '☁️ 주소·키 준비됨 · ‘지금 동기화’를 한 번 누르면 자동 동기화가 시작돼요';
    if(c.lastSync) return '☁️ 연결됨 · 마지막 동기화 ' + fmtDate(dateKey(new Date(c.lastSync))) + ' ' + fmtTime(c.lastSync);
    return '☁️ 연결됨 · 아직 동기화 전이에요';
  }
  function markCloudError(e){
    var msg = (e && e.message) ? e.message : '연결 실패';
    var c = cloudCfg();
    if(/HTTP 404|PGRST205|42P01|Bucket not found|NoSuchBucket/i.test(msg)){
      c.lastError = '';
      c.needsSetup = true;
    } else {
      c.needsSetup = false;
      c.lastError = msg;
    }
    if(ui.view === 'parent') renderParentPanel();
  }
  function cloudPull(silent){
    if(!cloudReady()) return Promise.resolve(false);
    var url = cloudBase() + '/rest/v1/' + cloudTable() +
      '?id=eq.' + encodeURIComponent(cloudRow()) + '&select=state,updated_at';
    return fetch(url, {headers: cloudHdrs({Accept: 'application/json'}), cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(rows){
        var c0 = cloudCfg();
        c0.needsSetup = false;          /* 테이블이 읽혔다는 건 준비가 끝났다는 뜻 */
        c0.lastError = '';
        c0.verified = true;
        var row = rows && rows[0];
        if(!row || !row.state) return false;
        var at = Date.parse(row.updated_at || '') || Number(row.state.updatedAt) || 0;
        var seen = Number(cloudCfg().lastPulledAt) || 0;
        if(at && at <= seen) return false;            /* 이미 받은 버전이면 그대로 */
        var keep = cloudCfg();
        var next = normalize(row.state);
        next.settings.cloud = keep;                   /* 이 기기의 연결 설정은 유지 */
        state = next;
        if(!state.children.some(function(c){ return c.id === ui.kidId; })) ui.kidId = state.children[0].id;
        ui.manageKid = ui.kidId;
        ui.kidUnlocked[ui.kidId] = true;
        keep.lastPulledAt = at || Date.now();
        keep.lastSync = Date.now();
        keep.lastError = '';
        keep.needsSetup = false;
        keep.verified = true;
        save(true);
        render();
        if(!silent) toast('☁️ 클라우드에서 최신 기록을 받았어요');
        return true;
      })
      .catch(function(e){ markCloudError(e); return false; });
  }
  function cloudPush(silent){
    if(!cloudReady()) return Promise.resolve(false);
    state.updatedAt = Date.now();
    var body = [{ id: cloudRow(), state: state, updated_at: new Date().toISOString() }];
    var url = cloudBase() + '/rest/v1/' + cloudTable() + '?on_conflict=id&select=id,updated_at';
    return fetch(url, {
      method: 'POST',
      headers: cloudHdrs({'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation'}),
      body: JSON.stringify(body)
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().catch(function(){ return null; });
    }).then(function(rows){
      var at = (rows && rows[0] && Date.parse(rows[0].updated_at || '')) || Date.now();
      cloudCfg().lastPulledAt = at;
      cloudCfg().lastSync = Date.now();
      cloudCfg().lastError = '';
      cloudCfg().needsSetup = false;
      cloudCfg().verified = true;
      save(true);
      if(ui.view === 'parent') renderParentPanel();
      if(!silent) toast('☁️ 클라우드에 저장했어요');
      return true;
    }).catch(function(e){
      markCloudError(e);
      if(!silent) toast('동기화하지 못했어요 · 이 기기에는 저장됨');
      return false;
    });
  }
  function cloudUploadPhoto(dataUrl, path){
    if(!cloudReady()) return Promise.resolve(null);
    var blob = dataUrlToBlob(dataUrl);
    if(!blob) return Promise.resolve(null);
    var safePath = String(path).split('/').map(encodeURIComponent).join('/');
    var url = cloudBase() + '/storage/v1/object/' + cloudBucket() + '/' + safePath;
    var pub = cloudBase() + '/storage/v1/object/public/' + cloudBucket() + '/' + safePath;
    return fetch(url, {
      method: 'POST',
      headers: cloudHdrs({'Content-Type': 'image/jpeg', 'x-upsert': 'true'}),
      body: blob
    }).then(function(r){
      if(!r.ok) throw new Error('사진 HTTP ' + r.status);
      return pub;
    }).catch(function(e){ markCloudError(e); return null; });
  }
  function cloudSync(){
    closeModal();
    if(!cloudReady()){ toast('지금은 이 기기 저장(로컬) 모드예요 · anon 키를 넣으면 연결돼요'); return; }
    ui.cloudBusy = true;
    if(ui.view === 'parent') renderParentPanel();
    cloudPull(true).then(function(){
      if(cloudCfg().needsSetup) return false;
      return cloudPush(false);
    }).then(function(ok){
      ui.cloudBusy = false;
      if(ui.view === 'parent') renderParentPanel();
      render();
      if(cloudCfg().needsSetup){
        toast('☁️ 아래 SQL을 Supabase SQL Editor에서 한 번 실행해 주세요', 'big');
      } else if(ok === false && cloudCfg().lastError){
        toast('동기화하지 못했어요 · 이 기기에는 저장됨');
      }
    });
  }
  function saveCloudConfig(){
    var urlEl = document.getElementById('cloudUrl'), keyEl = document.getElementById('cloudKey'), rowEl = document.getElementById('cloudRow');
    var url = ((urlEl && urlEl.value) || '').trim().replace(/\/+$/, '');
    var key = ((keyEl && keyEl.value) || '').trim();
    var row = ((rowEl && rowEl.value) || 'family').trim().replace(/[^A-Za-z0-9_-]/g, '') || 'family';
    if(url && !/^https?:\/\//.test(url)){ toast('주소는 https:// 로 시작해야 해요'); return; }
    var c = cloudCfg();
    if(c.row !== row || c.url !== url || c.key !== key){ c.lastPulledAt = 0; c.verified = false; }
    c.url = url;
    c.key = key;
    c.row = row;
    c.enabled = true;
    c.lastError = '';
    c.needsSetup = false;
    save();
    renderParentPanel();
    toast(cloudReady() ? '☁️ 클라우드 연결을 저장했어요' : '저장했어요 · anon 키를 넣으면 클라우드에 연결돼요');
  }
  function cloudOff(){
    var c = cloudCfg();
    c.enabled = false;
    c.url = ''; c.key = ''; c.lastPulledAt = 0; c.lastError = ''; c.needsSetup = false; c.verified = false;
    save(true);
    renderParentPanel();
    toast('클라우드 연결을 해제했어요 · 이 기기에만 저장해요');
  }

  function markRequestDone(id){
    var q = null;
    for(var i=0;i<(state.requests||[]).length;i++){ if(state.requests[i].id===id){ q = state.requests[i]; break; } }
    if(!q) return;
    if(q.status === 'done'){ toast('이미 반영 완료예요'); return; }
    if(q.status !== 'pending'){ toast('대기 중인 신청만 반영할 수 있어요'); return; }
    q.status = 'done';
    q.doneTs = Date.now();
    state.updatedAt = Date.now();
    save(); render();
    chime(true); confetti(18);
    toast('✅ ' + kid(q.childId).name + ' · ' + q.minutes + '분 반영 완료로 표시했어요', 'big');
  }

  function cancelRequest(id){
    var q = null;
    for(var i=0;i<(state.requests||[]).length;i++){ if(state.requests[i].id===id){ q = state.requests[i]; break; } }
    if(!q) return;
    if(q.status !== 'pending'){ toast('대기 중인 신청만 취소할 수 있어요'); return; }
    var c = kid(q.childId);
    confirmAsk('신청을 취소하고 포인트를 돌려줄까요?', esc(c.name) + '의 ' + q.minutes + '분 신청(' + q.cost + 'P)을 취소하고 포인트를 돌려줘요.', '취소·환불', function(){

      state.updatedAt = Date.now();
      save(); closeModal(); render();
      toast('↩️ ' + q.cost + 'P를 돌려줬어요');
    }, true);
  }

  function renderPinDots(){
    var dots = document.querySelectorAll('#pinDots .dot');
    for(var i=0;i<dots.length;i++){ dots[i].className = 'dot' + (i < ui.pinBuffer.length ? ' on' : ''); }
  }

  function pinKey(k){
    if(ui.pinBuffer.length >= 4) return;
    ui.pinBuffer += k;
    ui.pinError = '';
    renderPinDots();
    var errEl = document.getElementById('pinErr');
    if(errEl) errEl.textContent = '';
    if(ui.pinBuffer.length === 4){
      setTimeout(function(){ checkPin(); }, 120);
    }
  }
  function checkPin(){
    if(ui.pinBuffer === state.settings.pin){
      ui.parentUnlocked = true;
      ui.pinBuffer = '';
      ui.pinError = '';
      chime(true);
      render();
      toast('부모 모드 열렸어요');
    } else {
      ui.pinError = 'PIN이 맞지 않아요. 다시 입력해 주세요.';
      ui.pinBuffer = '';
      var dots = document.getElementById('pinDots');
      if(dots){ dots.classList.add('shake'); setTimeout(function(){ dots.classList.remove('shake'); }, 400); }
      var errEl = document.getElementById('pinErr');
      if(errEl) errEl.textContent = ui.pinError;
      renderPinDots();
      vibrate([20,60,20]);
    }
  }

  function saveTask(id){
    var title = (document.getElementById('f-title').value || '').trim();
    if(!title){ toast('할 일 이름을 적어 주세요'); return; }
    var points = clamp(parseInt(document.getElementById('f-points').value,10) || 0, 0, 999);
    var childId = document.getElementById('f-child').value;
    var time = document.getElementById('f-time').value || '';
    var note = (document.getElementById('f-note').value || '').trim();
    var needPhoto = !!(document.getElementById('f-needphoto') && document.getElementById('f-needphoto').checked);
    if(id){
      state.tasks.forEach(function(t){
        if(t.id===id){ t.title=title; t.points=points; t.childId=childId; t.time=time; t.note=note; t.needPhoto=needPhoto; }
      });
      toast('계획을 수정했어요');
    } else {
      state.tasks.push({id:uid(), childId:childId, title:title, time:time, note:note, points:points, order:state.tasks.length, needPhoto:needPhoto});
      toast('계획을 추가했어요');
    }
    ui.manageKid = childId;
    refreshToday();
    save(); closeModal(); render();
  }

    var desc = (document.getElementById('f-r-desc').value || '').trim();
    if(id){
      state.rewards.forEach(function(r){ if(r.id===id){ r.title=title; r.cost=cost; r.emoji=emoji; r.desc=desc; r.minutes=minutes; } });
      toast(minutes ? ('보상을 수정했어요 · ' + minutes + '분 / ' + cost + 'P') : '보상을 수정했어요');
    } else {
      state.rewards.push({id:uid(), title:title, cost:cost, emoji:emoji, desc:desc, minutes:minutes});
      toast(minutes ? ('시간 보상을 추가했어요 · ' + minutes + '분 / ' + cost + 'P') : '보상을 추가했어요');
    }
    state.settings.phoneSeeded = true;
    save(); closeModal(); render();
  }

  function kidForm(c){
    openSheet(
      '<h3>아이 정보 수정</h3>' +
      '<div class="sub">탭에 보이는 이름과 이모지를 바꿀 수 있어요.</div>' +
      '<div class="fieldrow">' +
        '<label class="field" style="flex:0 0 90px"><span>이모지</span><input id="f-k-emoji" type="text" maxlength="4" value="' + esc(c.emoji) + '"></label>' +
        '<label class="field"><span>이름</span><input id="f-k-name" type="text" maxlength="10" value="' + esc(c.name) + '"></label>' +
      '</div>' +
      '<label class="field"><span>학년 (선택)</span><input id="f-k-grade" type="text" maxlength="10" value="' + esc(c.grade) + '"></label>' +
      '<label class="field"><span>기기 (핸드폰 시간 반영 방법 안내에 써요)</span><select id="f-k-device">' +
        '<option value="android"' + (c.device !== 'ios' ? ' selected' : '') + '>🤖 안드로이드 (Google Family Link)</option>' +
        '<option value="ios"' + (c.device === 'ios' ? ' selected' : '') + '>🍎 아이폰 (스크린 타임 직접 추가)</option>' +
      '</select></label>' +
      '<div class="sheet-actions">' +
        '<button class="btn-ghost" data-act="close-modal">취소</button>' +
        '<button class="btn-primary" data-act="save-kid" data-id="' + c.id + '">저장</button>' +
      '</div>'
    );
  }

  function confirmAsk(title, desc, label, fn, danger){
    ui.modalConfirm = fn;
    openSheet(
      '<h3>' + esc(title) + '</h3>' +
      '<div class="sub">' + desc + '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn-ghost" data-act="close-modal">취소</button>' +
        '<button class="btn-primary" style="' + (danger ? 'background:linear-gradient(135deg,#dc2626,#ef4444)' : '') + '" data-act="confirm-yes">' + esc(label) + '</button>' +
      '</div>'
    );
  }

  /* ═══════════ 백업 ═══════════ */
  function exportBackup(){
    var payload = JSON.stringify(state, null, 2);
    var d = new Date();
    var name = '삼남매_포인트_백업_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
    downloadFile(name, payload, 'application/json');
    toast('백업 파일을 내려받았어요');
  }
  function importBackup(file){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var obj = JSON.parse(String(fr.result));
        if(!obj || !Array.isArray(obj.children) || !Array.isArray(obj.tasks) || !Array.isArray(obj.ledger)){
          toast('백업 파일 형식이 아니에요'); return;
        }
        confirmAsk('백업 불러오기', '지금 이 기기의 기록을 백업 파일 내용으로 <b>덮어쓸까요?</b> 되돌릴 수 없어요.', '불러오기', function(){
          state = normalize(obj);
          ui.kidId = state.children[0].id;
          ui.manageKid = state.children[0].id;
          refreshToday();
          save(); closeModal(); render();
          toast('백업을 불러왔어요');
        }, true);
      }catch(e){ toast('백업 파일을 읽지 못했어요'); }
    };
    fr.readAsText(file);
  }

  /* ═══════════ 이벤트 ═══════════ */
  document.addEventListener('click', function(ev){
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if(!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    switch(act){
      case 'nav':
        ui.view = el.getAttribute('data-view');
        if(ui.view === 'parent' && !ui.parentUnlocked){ ui.pinBuffer=''; ui.pinError=''; }
        render();
        window.scrollTo({top:0, behavior:'smooth'});
        break;
      case 'hist-seg':
        ui.histSeg = el.getAttribute('data-seg') || 'day';
        if(ui.histSeg === 'week') ui.weekOffset = 0;
        if(ui.histSeg === 'month'){
          if(!parseDayKey(ui.selDay)) ui.selDay = dateKey();
        }
        renderProgress(kid(ui.kidId));
        break;
      case 'week-move':
        var wdir = parseInt(el.getAttribute('data-dir'),10) || 0;
        ui.weekOffset = clamp(ui.weekOffset + (wdir > 0 ? 1 : -1), -52, 0);
        renderProgress(kid(ui.kidId));
        break;
      case 'week-now':
        ui.weekOffset = 0;
        renderProgress(kid(ui.kidId));
        break;
      case 'month-move':
        var mdir = parseInt(el.getAttribute('data-dir'),10) || 0;
        var nm = new Date(ui.monthY, ui.monthM + (mdir > 0 ? 1 : -1), 1);
        var nowM = new Date();
        if(nm.getFullYear() > nowM.getFullYear() || (nm.getFullYear() === nowM.getFullYear() && nm.getMonth() > nowM.getMonth())) break;
        ui.monthY = nm.getFullYear();
        ui.monthM = nm.getMonth();
        ui.selDay = defaultSelDay(kid(ui.kidId).id, ui.monthY, ui.monthM);
        renderProgress(kid(ui.kidId));
        break;
      case 'month-now':
        var nowN = new Date();
        ui.monthY = nowN.getFullYear();
        ui.monthM = nowN.getMonth();
        ui.selDay = dateKey(nowN);
        renderProgress(kid(ui.kidId));
        break;
      case 'open-day':
        var dd = parseDayKey(id);
        if(!dd) break;
        ui.monthY = dd.getFullYear();
        ui.monthM = dd.getMonth();
        ui.selDay = id;
        ui.histSeg = 'month';
        renderProgress(kid(ui.kidId));
        var ddEl = document.getElementById('dayDetail');
        if(ddEl && ddEl.scrollIntoView){
          setTimeout(function(){ try{ ddEl.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){} }, 80);
        }
        break;
      case 'export-csv':
        exportProgressCsv();
        break;
      case 'export-report':
        exportProgressReport();
        break;
      case 'pick-kid':
        if(ui.kidId !== id){
          ui.kpinBuffer = '';
          ui.kpinError = '';
        }
        ui.kidId = id;
        ui.manageKid = id;
        if(!kidLocked(id)) ui.kidUnlocked[id] = true;
        render();
        break;
      case 'pick-day':
        ui.dayOffset = clamp(parseInt(el.getAttribute('data-off'),10) || 0, -2, 0);
        ui.kpinBuffer = '';
        ui.kpinError = '';
        render();
        break;
      case 'kpin':
        kidPinKey(el.getAttribute('data-k'));
        break;
      case 'kpin-del':
        ui.kpinBuffer = ui.kpinBuffer.slice(0,-1);
        renderKidDots();
        break;
      case 'kpin-clear':
        ui.kpinBuffer = '';
        renderKidDots();
        break;
      case 'lock-kid':
        delete ui.kidUnlocked[ui.kidId];
        ui.kpinBuffer = '';
        ui.kpinError = '';
        render();
        toast(kid(ui.kidId).name + ' 페이지를 잠갔어요');
        break;
      case 'goto-kid':
        ui.kidId = id;
        ui.manageKid = id;
        ui.view = 'today';
        if(!kidLocked(id)) ui.kidUnlocked[id] = true;
        render();
        window.scrollTo({top:0, behavior:'smooth'});
        break;
      case 'photo':
        photoSheet(id, selKey());
        break;
      case 'view-photo':
        openPhotoView(el.getAttribute('data-kid'), el.getAttribute('data-day'), id);
        break;
      case 'photo-cam':
      case 'photo-album':
        var input = document.getElementById(act === 'photo-cam' ? 'photoCam' : 'photoAlbum');
        if(input && ui.pendingPhoto) input.click();
        break;
      case 'uncheck':
        uncheckTask(el.getAttribute('data-day') || selKey(), el.getAttribute('data-kid') || kid(ui.kidId).id, id);
        closeModal();
        break;
      case 'save-kid-pin':
        var pinEl = document.getElementById('kp-' + id);
        var npv = pinEl ? (pinEl.value || '').trim() : '';
        if(!/^\d{4}$/.test(npv)){ toast('숫자 4자리로 정해 주세요'); return; }
        if(!state.settings.kidPins[id]) state.settings.kidPins[id] = {pin:'1111', lock:true};
        state.settings.kidPins[id].pin = npv;
        state.settings.kidPins[id].lock = true;
        delete ui.kidUnlocked[id];
        ui.kpinBuffer = '';
        save(); render();
        toast(kid(id).name + ' 비밀번호를 바꿨어요 (잠금 켜짐)');
        break;
      case 'toggle-kid-lock':
        if(!state.settings.kidPins[id]) state.settings.kidPins[id] = {pin:'1111', lock:true};
        state.settings.kidPins[id].lock = !state.settings.kidPins[id].lock;
        if(state.settings.kidPins[id].lock) delete ui.kidUnlocked[id];
        else ui.kidUnlocked[id] = true;
        save(); render();
        toast(kid(id).name + ' 잠금을 ' + (state.settings.kidPins[id].lock ? '켰어요' : '껐어요'));
        break;
      case 'save-cloud':
        saveCloudConfig();
        break;
      case 'sync-now':
        cloudSync();
        break;
      case 'cloud-off':
        cloudOff();
        break;
      case 'manage-kid':
        ui.manageKid = id;
        render();
        break;
      case 'toggle':
        toggleTask(id);
        break;
      case 'redeem':
        openRedeem(id);
        break;
      case 'do-redeem':
        doRedeem(id);
        break;
      case 'req-done':
        markRequestDone(id);
        break;
      case 'req-cancel':
        cancelRequest(id);
        break;
      case 'r-preset':
        var minEl = document.getElementById('f-r-minutes');
        if(minEl) minEl.value = el.getAttribute('data-min');
        var pchips = document.querySelectorAll('#f-r-presets .chip');
        for(var pi=0; pi<pchips.length; pi++) pchips[pi].classList.toggle('on', pchips[pi] === el);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'backdrop':
        if(ev.target === el) closeModal();
        break;
      case 'confirm-yes':
        if(ui.modalConfirm){ var fn = ui.modalConfirm; ui.modalConfirm = null; fn(); }
        break;
      case 'pin':
        pinKey(el.getAttribute('data-k'));
        break;
      case 'pin-del':
        ui.pinBuffer = ui.pinBuffer.slice(0,-1);
        renderPinDots();
        break;
      case 'pin-clear':
        ui.pinBuffer = '';
        renderPinDots();
        break;
      case 'lock-parent':
        ui.parentUnlocked = false; ui.pinBuffer=''; ui.pinError='';
        render();
        toast('부모 모드를 잠갔어요');
        break;
      case 'new-task':
        taskForm(null);
        break;
      case 'edit-task':
        var t = state.tasks.filter(function(x){ return x.id===id; })[0];
        if(t) taskForm(t);
        break;
      case 'save-task':
        saveTask(id || '');
        break;
      case 'del-task':
        confirmAsk('계획을 삭제할까요?', '이 항목의 오늘 체크 기록도 함께 사라져요. 지난 날짜의 진행도 기록은 그대로 남아요.', '삭제', function(){
          state.tasks = state.tasks.filter(function(x){ return x.id!==id; });
          Object.keys(state.checks).forEach(function(k){
            Object.keys(state.checks[k]).forEach(function(cid){
              if(state.checks[k][cid][id]) delete state.checks[k][cid][id];
            });
          });
          refreshToday();
          save(); closeModal(); render(); toast('삭제했어요');
        }, true);
        break;
      case 'new-reward':
        rewardForm(null);
        break;
      case 'edit-reward':
        var r = state.rewards.filter(function(x){ return x.id===id; })[0];
        if(r) rewardForm(r);
        break;
      case 'save-reward':
        saveReward(id || '');
        break;
      case 'del-reward':
        confirmAsk('보상을 삭제할까요?', '이미 교환·신청한 기록은 그대로 남아요.', '삭제', function(){
          state.rewards = state.rewards.filter(function(x){ return x.id!==id; });
          save(); closeModal(); render(); toast('삭제했어요');
        }, true);
        break;
      case 'edit-kid':
        var k = state.children.filter(function(x){ return x.id===id; })[0];
        if(k) kidForm(k);
        break;
      case 'save-kid':
        var name = (document.getElementById('f-k-name').value || '').trim();
        if(!name){ toast('이름을 적어 주세요'); return; }
        state.children.forEach(function(x){
          if(x.id===id){
            x.name = name;
            x.emoji = (document.getElementById('f-k-emoji').value || '🙂').trim() || '🙂';
            x.grade = (document.getElementById('f-k-grade').value || '').trim();
            var dv = document.getElementById('f-k-device');
            if(dv) x.device = (dv.value === 'ios') ? 'ios' : 'android';
          }
        });
        save(); closeModal(); render(); toast('아이 정보를 저장했어요');
        break;
      case 'adjust':
        var amt = clamp(parseInt(document.getElementById('adjAmount').value,10) || 0, 1, 999);
        var memo = (document.getElementById('adjMemo').value || '').trim();
        var sign = parseInt(el.getAttribute('data-sign'),10);
        if(sign < 0){
          var cur = pointsOf(ui.manageKid);
          if(cur <= 0){ toast('차감할 포인트가 없어요'); return; }
          if(amt > cur) amt = cur;
          amt = -amt;
        }
        addEntry(ui.manageKid, amt, amt>0 ? 'bonus' : 'penalty', memo || (amt>0 ? '보너스' : '차감'));
        refreshSnapshot(currentDay, ui.manageKid);
        save(); render();
        chime(amt>0); if(amt>0) confetti(10);
        toast((amt>0?'보너스 +':'차감 ') + Math.abs(amt) + 'P');
        break;
      case 'toggle-sound':
        state.settings.sound = !state.settings.sound;
        save(); render();
        toast(state.settings.sound ? '효과음을 켰어요' : '효과음을 껐어요');
        break;
      case 'save-pin':
        var np = (document.getElementById('newPin').value || '').trim();
        if(!/^\d{4}$/.test(np)){ toast('숫자 4자리로 정해 주세요'); return; }
        state.settings.pin = np;
        save(); render(); toast('PIN을 바꿨어요');
        break;
      case 'export':
        exportBackup();
        break;
      case 'reset-all':
        confirmAsk('모든 데이터를 지울까요?', '계획·보상·포인트 기록이 모두 사라져요. 먼저 백업을 받아 두세요.', '모두 지우기', function(){
          confirmAsk('정말 지울까요?', '이 작업은 되돌릴 수 없어요.', '정말 지우기', function(){
            try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){}
            state = defaultState();
            ui.kidId = state.children[0].id;
            ui.manageKid = state.children[0].id;
            ui.parentUnlocked = false;
            ui.dayOffset = 0;
            ui.kidUnlocked = {};
            ui.kidUnlocked[ui.kidId] = true;
            save(); closeModal(); render(); toast('초기화했어요');
          }, true);
        }, true);
        break;
    }
  });

  document.addEventListener('change', function(ev){
    if(!ev.target) return;
    if(ev.target.id === 'importFile'){
      var f = ev.target.files && ev.target.files[0];
      if(f) importBackup(f);
      return;
    }
    if(ev.target.id === 'photoCam' || ev.target.id === 'photoAlbum'){
      var pf = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if(pf) handlePhotoFile(pf);
    }
  });

  /* 날짜가 바뀌면 자동 새로고침 */
  setInterval(function(){
    if(dateKey() !== currentDay){
      ui.dayOffset = 0;
      render();
      toast('새로운 하루예요! 오늘의 계획을 시작해요');
    }
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && dateKey() !== currentDay){ ui.dayOffset = 0; render(); }
  });

  /* 시작 */
  render();
  if(!storageOK) showStorageWarning();
  /* 클라우드는 이 기기에서 한 번 ‘지금 동기화’로 확인된 뒤부터 자동으로 오간다 */
  if(cloudReady() && cloudCfg().verified && !cloudCfg().needsSetup){
    cloudPull(true).then(function(){ cloudPush(true); });
  }
})();
</script>
</body>
</html>
